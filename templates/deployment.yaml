apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    app: {{ include "common.names.fullname" . }}
    version: {{ .Chart.AppVersion }}
    {{- if .Values.deployment.labels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.deployment.labels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    version: {{ include "common.names.fullname" . }}-{{ .Release.Revision }}
    {{- if .Values.deployment.annotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.deployment.annotations "context" $ ) | nindent 4 }}
    {{ end }}
spec:
  revisionHistoryLimit: 2
  minReadySeconds: 10
  replicas: {{ int .Values.deployment.replicas }}
  selector:
    matchLabels:
        app: {{ include "common.names.fullname" . }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "common.names.fullname" . }}
        version: {{ .Chart.AppVersion }}
        {{- if .Values.deployment.labels }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.deployment.labels "context" $ ) | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.deployment.annotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.deployment.annotations "context" $ ) | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - name: web
        image: "ghcr.io/cdfcrew/website:{{ .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        
        securityContext:
          seccompProfile:
              type: RuntimeDefault
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "{{ .Values.deployment.resources.requests.memory }}"
            cpu: "{{ .Values.deployment.resources.requests.cpu }}"
          limits:
            memory: "{{ .Values.deployment.resources.limits.memory }}"
            cpu: "{{ .Values.deployment.resources.limits.cpu }}"
        ports:
        - name: http
          containerPort: 3000
        
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: http

      {{ if .Values.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.imagePullSecret }}
      {{ end }}