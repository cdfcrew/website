name: hugo

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      is-stable: ${{ steps.set-version.outputs.is-stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set version
        id: set-version
        shell: bash
        run: |
          JSON_VERSION=$(docker run --rm -v "$(pwd):/repo" gittools/gitversion /repo /output json)
          VERSION=$(echo $JSON_VERSION | jq -r '.SemVer')
          PRERELEASE_TAG=$(echo $JSON_VERSION | jq -r '.PreReleaseTag')
          is_stable=false
          if [[ "$PRERELEASE_TAG" = "" ]]; then
            is_stable=true
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo version=${VERSION} >> $GITHUB_OUTPUT
          echo "is-stable=$is_stable" >> $GITHUB_OUTPUT

      - name: Define image name
        shell: bash
        run: |
          image=ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          echo "IMAGE=$image" >> $GITHUB_ENV

      - name: Build website
        run: |
          docker build -t ${{ env.IMAGE }} .

      - name: Cache Trivy database
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: ${{ runner.os }}-trivy-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Scan images with Trivy
        env:
          trivy_version: 0.69.3
        run: |
          RESULT_FILE=local.trivy-result.txt
          TRIVY_CACHE_DIR="${{ github.workspace }}/.trivy-cache"
          touch $RESULT_FILE
          mkdir -p "$TRIVY_CACHE_DIR"

          image=${{ env.IMAGE }}

          echo "<details open><summary>Scan results for ${image}</summary>" >> $RESULT_FILE
          docker run \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd):/work" -w /work \
            -v "$TRIVY_CACHE_DIR:/trivy-cache" \
            aquasec/trivy:${trivy_version} --cache-dir "/trivy-cache" image \
            --no-progress \
            --exit-code 0 \
            ${image} | tee -a $RESULT_FILE
          echo "</details>" >> $RESULT_FILE
          cat $RESULT_FILE >> $GITHUB_STEP_SUMMARY

      - name: Login to GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE }}
  package:
    runs-on: ubuntu-latest
    needs: build
    env:
      VERSION: ${{ needs.build.outputs.version }}
      OUTPUT_FOLDER: local.chart-output
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: prepare distilled chart
        run: |
          mkdir -p ${{ env.OUTPUT_FOLDER }}
          cp chart/Chart.yaml ${{ env.OUTPUT_FOLDER }}
          cp chart/values.yaml ${{ env.OUTPUT_FOLDER }}
          cp -r chart/templates ${{ env.OUTPUT_FOLDER }}
          sed -i 's/version: .*/version: ${{ env.VERSION }}/g' ${{ env.OUTPUT_FOLDER }}/Chart.yaml
          sed -i 's/appVersion: .*/appVersion: ${{ env.VERSION }}/g' ${{ env.OUTPUT_FOLDER }}/Chart.yaml

      - name: push chart to branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: latest
          build_dir: ./local.chart-output

      - name: push chart to branch
        if: needs.build.outputs.is-stable == true
        uses: crazy-max/ghaction-github-pages@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_branch: stable
          build_dir: ./local.chart-output